name: Release

# Push a tag such as v0.1.0 (it must match the version in Cargo.toml; a suffix like -rc1 is
# allowed and makes it a pre-release) to build binaries for all platforms and publish them
# as a GitHub release. One archive per platform: the command line tool, and the desktop app
# where it is built (not for Intel Macs; see the README).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built on the oldest runner image so the binaries work with older glibc.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, test: true, gui: true }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, test: true, gui: true }
          - { os: macos-15, target: aarch64-apple-darwin, test: true, gui: true }
          # the Intel runner (the image is available until about August 2027); the desktop app is
          # not built for Intel Macs, so this archive has the command line tool only
          - { os: macos-15-intel, target: x86_64-apple-darwin, test: true, gui: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, test: true, gui: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # wxWidgets on Linux is the GTK3 port; these are the headers it is built against
      - name: Install GTK3 development packages (Linux desktop app)
        if: runner.os == 'Linux' && matrix.gui
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libgtk-3-dev libxkbcommon-dev libxtst-dev libclang-dev \
            libjpeg-dev libtiff-dev

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.gui }}

      - name: Test
        if: matrix.test
        run: cargo test --locked --release --target ${{ matrix.target }}

      - name: Test (desktop app)
        if: matrix.test && matrix.gui
        run: cargo test --locked --release -p sidfind-gui --target ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      # the desktop app builds wxWidgets (minutes, not seconds) and needs the C++ toolchain
      - name: Build (desktop app)
        if: matrix.gui
        run: cargo build --locked --release -p sidfind-gui --target ${{ matrix.target }}

      # The files are staged unpacked: the artifact is zipped by GitHub anyway, so an archive
      # inside it would be nested. The release job makes the final archives.
      - name: Stage files (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GUI: ${{ matrix.gui }}
          OS_NAME: ${{ runner.os }}
        run: |
          mkdir -p stage
          cp "target/${TARGET}/release/sidfind" LICENSE README.md stage/
          if [ "$GUI" = "true" ]; then
            if [ "$OS_NAME" = "macOS" ]; then
              # the desktop app as an application bundle; the icon comes from assets/icons
              app="stage/SidFind.app/Contents"
              mkdir -p "$app/MacOS" "$app/Resources"
              cp "target/${TARGET}/release/sidfind-gui" "$app/MacOS/"
              cp assets/icons/sidfind.icns "$app/Resources/"
              version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
              cat > "$app/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>SidFind</string>
            <key>CFBundleDisplayName</key><string>SidFind</string>
            <key>CFBundleIdentifier</key><string>io.github.docsnyderspage.sidfind</string>
            <key>CFBundleExecutable</key><string>sidfind-gui</string>
            <key>CFBundleIconFile</key><string>sidfind</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSPrincipalClass</key><string>NSApplication</string>
          </dict>
          </plist>
          EOF
            else
              cp "target/${TARGET}/release/sidfind-gui" stage/
            fi
          fi

      - name: Stage files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          GUI: ${{ matrix.gui }}
        run: |
          New-Item -ItemType Directory -Path stage | Out-Null
          $files = @("target/$env:TARGET/release/sidfind.exe", "LICENSE", "README.md")
          if ($env:GUI -eq "true") { $files += "target/$env:TARGET/release/sidfind-gui.exe" }
          Copy-Item $files -Destination stage

      - uses: actions/upload-artifact@v6
        with:
          name: sidfind-${{ matrix.target }}
          path: stage/*
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check that the tag matches the version in Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          # a pre-release suffix is allowed: v0.1.0-rc1 releases version 0.1.0
          if [ "${TAG%%-*}" != "v${version}" ]; then
            echo "Tag ${TAG} does not match Cargo.toml version ${version} (expected v${version} or v${version}-<suffix>)" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v7
        with:
          pattern: sidfind-*
          path: artifacts

      - name: Make the archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for dir in artifacts/sidfind-*/; do
            dir=${dir%/}
            target=${dir#artifacts/sidfind-}
            name="sidfind-${TAG}-${target}"
            # the artifacts may lose the file permissions, so the programs are made executable again
            for f in sidfind sidfind-gui; do
              if [ -f "$dir/$f" ]; then chmod +x "$dir/$f"; fi
            done
            if [ -f "$dir/SidFind.app/Contents/MacOS/sidfind-gui" ]; then
              chmod +x "$dir/SidFind.app/Contents/MacOS/sidfind-gui"
            fi
            mv "$dir" "dist/$name"
            case "$target" in
              *windows*) (cd dist && zip -qr "$name.zip" "$name") ;;
              *) tar -czf "dist/$name.tar.gz" -C dist "$name" ;;
            esac
            rm -r "dist/$name"
          done
          ls -l dist

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # A release may already exist, e.g. one created by hand in the web UI. Attach the
          # files to it instead of failing.
          if gh release view "${TAG}" --repo "${REPO}" > /dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber --repo "${REPO}"
          else
            flags=""
            case "${TAG}" in *-*) flags="--prerelease" ;; esac
            gh release create "${TAG}" dist/* --title "${TAG}" --generate-notes ${flags} --repo "${REPO}"
          fi
