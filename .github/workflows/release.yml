name: Release

# Push a tag such as v0.1.0 (it must match the version in Cargo.toml; a suffix like -rc1 is
# allowed and makes it a pre-release) to build binaries for all platforms and publish them
# as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built on the oldest runner image so the binaries work with older glibc.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, test: true }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, test: true }
          - { os: macos-latest, target: aarch64-apple-darwin, test: true }
          # built on the arm runner, so it cannot be tested there
          - { os: macos-latest, target: x86_64-apple-darwin, test: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, test: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Test
        if: matrix.test
        run: cargo test --locked --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          name="sidfind-${TAG}-${TARGET}"
          mkdir -p "dist/${name}"
          cp "target/${TARGET}/release/sidfind" LICENSE README.md "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          rm -r "dist/${name}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          $name = "sidfind-$env:TAG-$env:TARGET"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item "target/$env:TARGET/release/sidfind.exe", LICENSE, README.md -Destination "dist/$name"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse "dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: sidfind-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the version in Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          # a pre-release suffix is allowed: v0.1.0-rc1 releases version 0.1.0
          if [ "${TAG%%-*}" != "v${version}" ]; then
            echo "Tag ${TAG} does not match Cargo.toml version ${version} (expected v${version} or v${version}-<suffix>)" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # A release may already exist, e.g. one created by hand in the web UI. Attach the
          # files to it instead of failing.
          if gh release view "${TAG}" --repo "${REPO}" > /dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber --repo "${REPO}"
          else
            flags=""
            case "${TAG}" in *-*) flags="--prerelease" ;; esac
            gh release create "${TAG}" dist/* --title "${TAG}" --generate-notes ${flags} --repo "${REPO}"
          fi
