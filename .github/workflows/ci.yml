name: CI

on:
  push:
    # feature branches too, so the GUI can be tried on every platform without a pull request
    # or a release
    branches: [main, "feat/**"]
  pull_request:
  # the "Run workflow" button on the Actions tab (GitHub only offers it for workflows that
  # exist on the default branch)
  workflow_dispatch:

# a newer push to the same branch makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: cargo build --locked --release
      - run: cargo test --locked --release

  # The GUI is not part of the default workspace members (it needs a C++ toolchain and builds
  # wxWidgets, which takes minutes), so it has its own job. rust-cache keeps the wxWidgets
  # build between runs.
  gui:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04, not -latest: the binary needs the glibc of the build machine or newer, so
        # an older runner keeps it working on older distributions (ubuntu-latest needs GLIBC 2.43)
        os: [windows-latest, ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # wxWidgets on Linux is the GTK3 port; these are the headers it is built against
      - name: Install GTK3 development packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libgtk-3-dev libxkbcommon-dev libxtst-dev libclang-dev \
            libjpeg-dev libtiff-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: gui
      - run: cargo build --locked --release -p sidfind-gui
      - run: cargo test --locked --release -p sidfind-gui

      # a build to try by hand: download it from the run's page (it is not a release)
      - name: Collect the build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/sidfind-gui.exe dist/
      - name: Collect the build (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp target/release/sidfind-gui dist/
      - uses: actions/upload-artifact@v6
        with:
          name: sidfind-gui-${{ runner.os }}-dev-build
          path: dist/*
          retention-days: 7
          if-no-files-found: error
